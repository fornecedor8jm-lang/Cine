plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cineclub.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cineclub.tv'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
